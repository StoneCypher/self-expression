<section data-card="weather" class="ck-weather" data-stale="0" data-ord="75"><h2>Seattle</h2><button class="ck-gear" type="button" title="settings" aria-label="weather settings"></button><div class="ck-set" hidden><label for="weather-place">place</label><input id="weather-place" name="place" type="text" spellcheck="false" autocomplete="off" placeholder="city or town" value="Seattle"><label for="weather-units">units</label><select id="weather-units" name="units"><option value="c">Celsius</option><option value="f" selected>Fahrenheit</option></select><label for="weather-hours">outlook</label><select id="weather-hours" name="hours"><option value="12">12 hours</option><option value="24" selected>24 hours</option><option value="48">48 hours</option></select><p class="ck-set-foot">Readings refresh at most once every ten minutes.</p></div><div class="ck-wx-now"><div class="ck-wx-art" aria-hidden="true"></div><div class="ck-wx-read"><div class="ck-wx-temp">--<span>&deg;</span></div><div class="ck-wx-desc">waiting for a reading</div><div class="ck-wx-meta"></div></div></div><div class="ck-wx-spark"></div><div class="ck-cap"></div></section>
