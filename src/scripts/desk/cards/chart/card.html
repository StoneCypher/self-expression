<section data-card="chart" class="ck-chart">
  <h2>requests to the desk, by hour</h2>
  <svg class="ck-plot" role="img" viewBox="0 0 640 300" aria-label="Line chart of 2 series (served, refused) across 0 to 23 on the hour of the local day axis. requests runs from 0 to 97. The highest is 97, in served, at 15."></svg>
  <div class="ck-legend"><button type="button" class="ck-key" data-series="0" aria-pressed="true"><i data-s="1"></i>served</button><button type="button" class="ck-key" data-series="1" aria-pressed="true"><i data-s="2"></i>refused</button></div>
  <div class="ck-cap">line chart &mdash; <b>48</b> points across 0 to 23 in <b>2</b> series. the peak is <b>97</b> (served) at 15. <span class="ck-aside">click a key to drop a series.</span></div>
</section>
