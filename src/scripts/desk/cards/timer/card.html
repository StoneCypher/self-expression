<section data-card="timer" class="ck-timer" data-mode="pomodoro" data-phase="work" data-state="idle" data-wide="off" data-ord="42"><h2>a working session</h2><button class="ck-gear" type="button" title="settings" aria-label="timer settings"></button><div class="ck-set" hidden><label for="timer-work">work (min)</label><input id="timer-work" name="work" type="number" min="1" max="10080" step="1" inputmode="numeric" value="25"><label for="timer-rest">rest (min)</label><input id="timer-rest" name="rest" type="number" min="1" max="10080" step="1" inputmode="numeric" value="5"><label for="timer-rounds">rounds</label><input id="timer-rounds" name="rounds" type="number" min="0" max="999" step="1" inputmode="numeric" value="4"><label for="timer-chime">chime</label><input id="timer-chime" name="chime" type="checkbox"><p class="ck-set-foot">Work, rest and rounds shape pomodoro mode only. Rounds 0 cycles without a limit. Chime flashes the card: a card has no audio channel on this desk, so it cannot make a sound.</p></div><div class="ck-body"><svg class="ck-arc" viewBox="0 0 100 100" role="img" aria-label="progress through the current interval"><circle class="ck-arc-well" cx="50" cy="50" r="42"/><circle class="ck-arc-run" cx="50" cy="50" r="42" transform="rotate(-90 50 50)" stroke-dasharray="0 263.89"/><rect class="ck-mk ck-mk-work" x="42" y="42" width="16" height="16" rx="1.5"/><circle class="ck-mk ck-mk-rest" cx="50" cy="50" r="8"/></svg><div class="ck-read"><div class="ck-elapsed">00:00</div><div class="ck-phase" aria-live="polite"><span class="ck-phase-t">work</span></div><div class="ck-rounds"></div></div></div><div class="ck-ctl"><button class="ck-go" type="button">start</button><button class="ck-reset" type="button">reset</button></div><div class="ck-cap">card review</div></section>
